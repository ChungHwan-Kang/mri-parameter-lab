name: Deploy MRI Parameter Lab v1.2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mri-parameter-lab-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy-only repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare frozen site assets
        run: |
          mkdir -p _site/assets
          cp index.html .nojekyll RELEASE_PROVENANCE.txt _site/
          cp assets/* _site/assets/
          grep -q '/mri-parameter-lab/assets/' _site/index.html
          grep -q 'source_sha=da8e185c9e792cdcc69d2e20f02de00f36e90de0' _site/RELEASE_PROVENANCE.txt
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
